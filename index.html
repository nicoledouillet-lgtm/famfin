<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const DB = 'family-finances', STORE = 'k';

  // The derived key (never the passphrase) can be kept on this device, as a non-exportable key.
  const idb = (mode, fn) => new Promise((res, rej) => {
    const open = indexedDB.open(DB, 1);
    open.onupgradeneeded = () => open.result.createObjectStore(STORE);
    open.onerror = () => rej(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction(STORE, mode);
      const req = fn(tx.objectStore(STORE));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    };
  });
  const savedKey = () => idb('readonly', (s) => s.get(P.kid)).catch(() => null);
  const saveKey = (k) => idb('readwrite', (s) => s.put(k, P.kid)).catch(() => {});
  const forgetKeys = () => idb('readwrite', (s) => s.clear()).catch(() => {});

  const derive = async (pass) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  };
  const decrypt = async (key) => {
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  };

  const form = document.getElementById('unlock'), msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('pass').value;
    if (!pass) return;
    msg.textContent = 'Unlocking…';
    let key, data;
    try {
      key = await derive(pass);
      data = await decrypt(key);
    } catch { msg.textContent = 'That passphrase didn’t work.'; return; }
    msg.textContent = '';
    if (document.getElementById('remember').checked) await saveKey(key);
    document.getElementById('pass').value = '';
    start(data);
  });
  document.getElementById('lockbtn').addEventListener('click', async () => { await forgetKeys(); location.reload(); });
  savedKey().then(async (k) => { if (!k) return; try { start(await decrypt(k)); } catch { forgetKeys(); } });

  // A small stand-in for the Claude Dashboard runtime the page was written for.
  function start(data) {
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('updated').textContent = 'Updated ' + new Date(data.built).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    const num = /^-?\d+(\.\d+)?$/;
    // csvParseRows, not csvParse: csvParse builds rows with new Function, which the page's security policy blocks
    const parse = (text) => {
      const [head, ...rows] = d3.csvParseRows(text);
      return rows.map((cells) => Object.fromEntries(head.map((k, i) => [k, num.test(cells[i] ?? '') ? +cells[i] : (cells[i] ?? '')])));
    };
    const raw = {};
    for (const [id, text] of Object.entries(data.datasets)) raw[id] = parse(text);
    const calcs = {}, cache = {}, draws = [], hooks = [];
    const PKEY = 'family-finances-params';
    let params = { ...data.params };
    try { Object.assign(params, JSON.parse(localStorage.getItem(PKEY) || '{}')); } catch {}
    const get = (id) => {
      if (raw[id]) return { status: 'ok', data: raw[id] };
      if (cache[id]) return cache[id];
      const c = calcs[id];
      if (!c) return { status: 'error', data: [] };
      try {
        const ins = c.inputs.map(get);
        cache[id] = ins.every((d) => d.status === 'ok') ? { status: 'ok', data: c.fn(...ins.map((d) => d.data)) } : { status: 'error', data: [] };
      } catch (err) { console.error(id, err); cache[id] = { status: 'error', data: [] }; }
      return cache[id];
    };
    let ready = false;
    const runDraw = ([name, fn]) => document.querySelectorAll(`[data-draw="${name}"]`).forEach((el) => {
      try { fn(el); } catch (err) { console.error(name, err); }
    });
    const render = () => { draws.forEach(runDraw); hooks.forEach((h) => { try { h(); } catch (err) { console.error(err); } }); };
    window.dash = {
      colors: ['#3a6fc4', '#d9822b', '#2f9c6a', '#9a5bb5', '#c44a3a', '#1f9bb0', '#8b6d3e', '#d4669f'],
      data: get,
      calc: (name, def) => { calcs[name] = def; },
      // draw(name, fn) registers a drawing; draw(name) alone redraws it, as the dashboard runtime does
      draw: (name, fn) => {
        if (!fn) { draws.filter(([n]) => n === name).forEach(runDraw); return; }
        draws.push([name, fn]); if (ready) runDraw([name, fn]);
      },
      onData: (fn) => { hooks.push(fn); if (ready) fn(); },
      params: () => params,
      setParams: (p) => {
        params = { ...params, ...p };
        for (const k in params) if (params[k] == null) delete params[k];
        try { localStorage.setItem(PKEY, JSON.stringify(params)); } catch {}
        for (const k in cache) delete cache[k];  // calculations may read params (the not-work marks)
        render();
      },
    };
    // Insert the page, then run its scripts in order (scripts added through innerHTML don't run on their own).
    const page = document.getElementById('page');
    page.innerHTML = data.html;
    page.querySelectorAll('script').forEach((old) => {
      const s = document.createElement('script');
      s.textContent = '{\n' + old.textContent + '\n}';  // each block in its own scope, as the dashboard runtime ran them
      old.replaceWith(s);
    });
    ready = true;
    render();
    let t;
    addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 150); });
  }
})();
</script>
